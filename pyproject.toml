[project]
name = "autonomous-software-qa-debugger-agent"
version = "1.0.0"
description = "A local-first dashboard for running software QA checks and understanding failures."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools]
py-modules = ["app", "qa_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", ".venv", "venv", "node_modules", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
